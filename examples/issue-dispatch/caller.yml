# Each repository the hub dispatches issues of: .github/workflows/agent.yml.
# It calls the reusable workflow (agent-dispatch.yml) in the central
# repository; change k1dav-c/.github to where you keep it.
name: agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  dispatch:
    uses: k1dav-c/.github/.github/workflows/agent-dispatch.yml@main
