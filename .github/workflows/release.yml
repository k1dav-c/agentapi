name: Release

# Every push to main computes the next semantic version from the Conventional
# Commits since the last vX.Y.Z tag (see next-version.sh), builds agentapi
# binaries (with the chat UI embedded) stamped with that version, then creates
# the vX.Y.Z tag and GitHub release with the binaries attached. Pushes that only
# contain docs/chore/test/ci/style/build commits do not produce a release.
#
# workflow_dispatch forces a release with an explicit bump. Publishing a release
# by hand still works: its binaries are built with the release's tag as the
# version.
#
# Nothing is released unless the Linux tests (go-test.yml, called here) pass on
# the same commit, whatever started the run: AgentAPIs with --allow-update
# install the latest release. The tests run in this workflow rather than the
# release waiting for the Go Tests workflow (workflow_run), so that one
# mechanism covers every trigger and the commit tested is github.sha;
# go-test.yml therefore doesn't run on pushes to main itself.
#
# A first, cheap job (plan) asks release-version.sh whether the run releases
# anything; the tests and the release run only then, so a push of docs alone
# costs seconds. The release job asks again once it has its turn, since a
# push before it may have released meanwhile. A manual run releases main
# only.
#
# The tests run on the self-hosted runner for tests (label ci); the release
# on another (label release), as a user of its own with its own Go and Bun
# caches, so that nothing a pull request's job leaves behind goes into a
# release's binaries (see MAINTAINERS.md).
#
# The release is created in this workflow, not by a separate release-triggered
# one, because releases created with GITHUB_TOKEN don't trigger other workflows.

permissions:
  contents: read

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto derives it from commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, ci]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A manual release runs on main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(./release-version.sh)" >> "$GITHUB_OUTPUT"

  test:
    name: Go Tests
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/go-test.yml

  release:
    name: Build and Release
    needs: [plan, test]
    runs-on: [self-hosted, release]
    permissions:
      contents: write
    # One release at a time, after the tests; the tests of later pushes run
    # meanwhile. GitHub keeps one run waiting per group: one that waits is
    # cancelled when another starts waiting, and the commits of a cancelled
    # push go out with the next release. A release published by hand has a
    # group of its own, so a push doesn't cancel it and leave it without
    # binaries.
    concurrency:
      group: ${{ github.event_name == 'release' && format('release-{0}', github.event.release.tag_name) || 'release' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(./release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.version.outputs.version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun
        if: steps.version.outputs.version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Chat Dependencies
        if: steps.version.outputs.version != ''
        run: cd chat && bun install --frozen-lockfile

      - name: Run make gen and check for unstaged changes
        if: steps.version.outputs.version != ''
        run: |
          make gen
          (cd chat && bun run gen:api)
          ./check_unstaged.sh

      - name: Build binaries
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          build_variants=(
            "linux amd64 agentapi-linux-amd64"
            "linux arm64 agentapi-linux-arm64"
            "darwin amd64 agentapi-darwin-amd64"
            "darwin arm64 agentapi-darwin-arm64"
            "windows amd64 agentapi-windows-amd64.exe"
          )

          # The chat once, then the five binaries side by side.
          make embed
          pids=()
          for variant in "${build_variants[@]}"; do
            read -r goos goarch artifact_name <<< "$variant"
            echo "Building for GOOS=$goos GOARCH=$goarch..."
            GOOS="$goos" GOARCH="$goarch" BINPATH="out/$artifact_name" make build &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          ./out/agentapi-linux-amd64 --version

          # Each asset is built for its platform: the build settings Go
          # records in it name the GOOS and GOARCH.
          for variant in "${build_variants[@]}"; do
            read -r goos goarch artifact_name <<< "$variant"
            file "out/$artifact_name"
            settings=$(go version -m "out/$artifact_name")
            for want in "GOOS=$goos" "GOARCH=$goarch"; do
              if ! grep -qxF $'\tbuild\t'"$want" <<< "$settings"; then
                echo "::error::out/$artifact_name isn't built with $want"
                echo "$settings"
                exit 1
              fi
            done
          done

          (
            cd out
            sha256sum agentapi-* > checksums.txt
          )

      - name: Create release
        if: steps.version.outputs.version != '' && github.event_name != 'release'
        run: |
          gh release create "v${VERSION}" out/* \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload release assets
        if: steps.version.outputs.version != '' && github.event_name == 'release'
        run: gh release upload "${RELEASE_TAG}" out/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
