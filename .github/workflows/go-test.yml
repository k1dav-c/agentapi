name: Go Tests

# Pull requests run the tests here. Pushes to main, manual releases and
# published releases run them through the Release workflow (workflow_call),
# which releases only once they (test, race, lint) pass.
#
# The jobs run on the repository's self-hosted Linux runner. A pull request
# from a fork runs none: its code would run on that machine. The repository
# also asks for approval before an outside contributor's workflows run.
on:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: [self-hosted, linux, x64]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Test
              run: CGO_ENABLED=0 go test -count=1 -v ./...

    race:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: [self-hosted, linux, x64]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            # The race detector needs cgo; the SQLite driver is pure Go.
            - name: Test with the race detector
              run: CGO_ENABLED=1 go test -race -count=1 ./lib/... ./cmd/...

    lint:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: [self-hosted, linux, x64]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Chat Dependencies
              run: cd chat && bun install

            - name: run linters
              run: make lint

            - name: Test the chat
              run: cd chat && bun test

            - name: Check for unstaged changes
              run: |
                  make gen
                  ./check_unstaged.sh
