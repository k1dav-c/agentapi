name: Build Discord worker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'cmd/discord/**'
      - 'lib/discordbridge/**'
      - 'lib/handoff/**'
      - 'lib/httpapi/**'
      - 'lib/temporalconfig/**'
      - 'Dockerfile.discord'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/discord-image.yml'
  pull_request:
    paths:
      - 'cmd/discord/**'
      - 'lib/discordbridge/**'
      - 'lib/handoff/**'
      - 'lib/httpapi/**'
      - 'lib/temporalconfig/**'
      - 'Dockerfile.discord'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/discord-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/agentapi-discord
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.discord
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
