services:
  agentapi-discord:
    # Set AGENTAPI_DISCORD_IMAGE in Coolify to the GHCR image produced by CI.
    image: ${AGENTAPI_DISCORD_IMAGE:-ghcr.io/coder/agentapi/agentapi-discord:latest}
    restart: unless-stopped
    environment:
      AGENTAPI_DISCORD_AGENT_URL: ${AGENTAPI_DISCORD_AGENT_URL:-http://host.docker.internal:3284}
      AGENTAPI_API_TOKEN: ${AGENTAPI_API_TOKEN:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-host.docker.internal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      AGENTAPI_DISCORD_TASK_QUEUE: ${AGENTAPI_DISCORD_TASK_QUEUE:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
    # Coolify normally provides the values above as environment variables.
    # To use an exported config, mount it at /data/temporal.json and set
    # AGENTAPI_TEMPORAL_CONFIG=/data/temporal.json in Coolify.
